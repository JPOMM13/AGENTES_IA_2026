apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventos-backend
  namespace: eventos
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eventos-backend
                port:
                  number: 8000
