<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3542"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .node { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 14; }
      .guardrail { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .tool { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .end { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .startend { fill: #111827; stroke: #111827; stroke-width: 2; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .start-label { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .line { stroke: #2f3542; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #6b7280; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow-dashed); }
      .edge-label { font: 700 12px Arial, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="60" y="55">Grafo LangGraph del cotizador de eventos</text>
  <text class="subtitle" x="60" y="82">Workflow productivo: guardrails, router de intencion, memoria, decision agentica, tools de negocio y salida validada.</text>

  <circle class="startend" cx="590" cy="130" r="34"/>
  <text class="start-label" x="562" y="135">START</text>

  <rect class="guardrail" x="430" y="190" width="320" height="76"/>
  <text class="label" x="493" y="222">validar_entrada</text>
  <text class="small" x="465" y="246">Guardrail antes de LLM, memoria y tools</text>

  <rect class="node" x="430" y="325" width="320" height="82"/>
  <text class="label" x="466" y="357">extraer_y_enrutar_intencion</text>
  <text class="small" x="468" y="381">Clasificador LLM + extractor de campos</text>

  <rect class="node" x="430" y="470" width="320" height="82"/>
  <text class="label" x="456" y="502">gestionar_memoria_persistente</text>
  <text class="small" x="464" y="526">Busca o retoma cotizaciones previas</text>

  <rect class="decision" x="60" y="470" width="300" height="82"/>
  <text class="label" x="119" y="502">decidir_accion_agentica</text>
  <text class="small" x="99" y="526">create_agent decide accion permitida</text>

  <rect class="tool" x="60" y="325" width="300" height="82"/>
  <text class="label" x="117" y="357">ejecutar_tools_negocio</text>
  <text class="small" x="94" y="381">Cobertura, catalogo, stock, RAG, cotizacion</text>

  <rect class="end" x="820" y="325" width="300" height="82"/>
  <text class="label" x="887" y="357">evaluar_salida_guardrail</text>
  <text class="small" x="874" y="381">Valida respuesta final y persiste estado</text>

  <circle class="startend" cx="970" cy="510" r="34"/>
  <text class="start-label" x="948" y="515">END</text>

  <path class="line" d="M590 164 L590 190"/>
  <path class="dashed" d="M590 266 L590 325"/>
  <text class="edge-label" x="610" y="302">continuar</text>

  <path class="line" d="M590 407 L590 470"/>

  <path class="dashed" d="M430 511 L360 511"/>
  <text class="edge-label" x="371" y="493">continuar</text>

  <path class="line" d="M210 470 L210 407"/>
  <path class="line" d="M360 366 L820 366"/>
  <path class="line" d="M970 407 L970 476"/>

  <path class="dashed" d="M750 228 C880 228 970 245 970 325"/>
  <text class="edge-label" x="828" y="210">finalizar si entrada bloqueada</text>

  <path class="dashed" d="M750 511 C870 511 970 486 970 407"/>
  <text class="edge-label" x="820" y="540">finalizar si memoria resuelve</text>

  <rect x="60" y="615" width="1060" height="58" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text class="small" x="86" y="640">Ruta normal: START -> validar_entrada -> extraer_y_enrutar_intencion -> gestionar_memoria_persistente -> decidir_accion_agentica -> ejecutar_tools_negocio -> evaluar_salida_guardrail -> END</text>
  <text class="small" x="86" y="660">Rutas condicionales: validar_entrada y gestionar_memoria_persistente pueden saltar directo a evaluar_salida_guardrail.</text>
</svg>
