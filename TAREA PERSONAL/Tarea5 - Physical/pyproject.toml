[project]
name = "caltrans-public-camera-mcp"
version = "1.0.0"
description = "MCP demo for read-only access to official Caltrans public CCTV snapshots"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["camera_client", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
